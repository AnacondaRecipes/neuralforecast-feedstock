{% set name = "neuralforecast" %}
{% set version = "3.2.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0f98002aa48728dfc54768da3791531e184d01c9e1af037a2172b763d152edd1

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # No ray-tune for py314
  skip: true  # [py<310  or py>313]

# Upstream source - https://github.com/Nixtla/neuralforecast/blob/v3.2.2/pyproject.toml
requirements:
  host:
    - pip
    - python
    - setuptools >=83.0.0
    - wheel
  run:
    - python
    - coreforecast >=0.0.6
    - fsspec
    - numpy >=1.21.6
    - pandas >=1.3.5
    - scipy
    - pytorch >=2.9.1
    - tornado >=6.5.5
    - pytorch-lightning >=2.0.0,<2.6.0
    # ray[train,tune]>=2.2.0
    - ray-train >=2.2.0
    - ray-tune >=2.2.0
    - optuna
    - utilsforecast >=0.2.3
  run_constrained:
    # spark
    - pyspark >=3.5
    - pyarrow >=23.0.1

# tests require polars, but polars existing in main conflicting with utilsforecast
# utilsforecast >=0.2.3 requires polars <=1.31 which conflicts with any installable versions previously reported
{% set ignored_tests = " --ignore=tests/test_core.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_distributed.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_tsdataset.py" %}

test:
  source_files:
    - tests
  imports:
    - neuralforecast
  commands:
    - pip check
    - pytest -vv tests {{ ignored_tests }}
  requires:
    - pip
    - pytest


about:
  home: https://github.com/Nixtla/neuralforecast/tree/main/
  summary: Deep Learning for Time Series Forecasting
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: |
    State-of-the-art time series forecasting for PyTorch.

    `NeuralForecast` is a Python library for time series forecasting with 
    deep learning models. It includes *benchmark datasets*, *data-loading 
    utilities*, *evaluation functions*, statistical *tests*, univariate *model 
    benchmarks* and *SOTA* models implemented in PyTorch and PyTorchLightning.

    PyPI: [https://pypi.org/project/neuralforecast/](https://pypi.org/project/neuralforecast/)
  doc_url: https://nixtla.github.io/neuralforecast
  dev_url: https://github.com/Nixtla/neuralforecast

extra:
  recipe-maintainers:
    - sugatoray
    - cchallu
    - FedericoGarza
  skip-lints:
    - cbc_dep_in_run_missing_from_host