{% set name = "neuralforecast" %}
{% set version = "3.3.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e8eab28dc61b1dacfefa1813a287e3119123f4b1c58f0224eb6351575fb4022d

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # upstream requires-python >=3.11; classifiers cover 3.11-3.14
  skip: true  # [py<311 or py>314]

# Upstream source - https://github.com/Nixtla/neuralforecast/blob/v3.3.1/pyproject.toml
requirements:
  host:
    - pip
    - python
    - setuptools >=84.0.0
    - wheel
  run:
    - python
    - coreforecast >=0.0.17
    - fsspec
    - numpy >=1.23.2
    - pandas >=2.3.3
    - scipy
    - pytorch >=2.9.1
    - tornado >=6.5.5
    - pytorch-lightning >=2.6.6
    - safetensors >=0.8.0
    # ray[train,tune]>=2.58.0
    - ray-train >=2.58.0
    - ray-tune >=2.58.0
    - optuna
    - utilsforecast >=0.2.3
  run_constrained:
    # spark
    - fugue
    - pyspark >=3.5
    - pyarrow >=23.0.1

# tests require polars, but polars existing in main conflicting with utilsforecast
# utilsforecast >=0.2.3 requires polars <=1.31 which conflicts with any installable versions previously reported
{% set ignored_tests = " --ignore=tests/test_core.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_distributed.py" %}
{% set ignored_tests = ignored_tests + " --ignore=tests/test_tsdataset.py" %}

test:
  source_files:
    - tests
  imports:
    - neuralforecast
  commands:
    - pip check
    - pytest -vv tests {{ ignored_tests }}
  requires:
    - pip
    - pytest
    - pytest-cov


about:
  home: https://github.com/Nixtla/neuralforecast/tree/main
  summary: Deep Learning for Time Series Forecasting
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: |
    State-of-the-art time series forecasting for PyTorch.

    `NeuralForecast` is a Python library for time series forecasting with 
    deep learning models. It includes *benchmark datasets*, *data-loading 
    utilities*, *evaluation functions*, statistical *tests*, univariate *model 
    benchmarks* and *SOTA* models implemented in PyTorch and PyTorchLightning.

    PyPI: [https://pypi.org/project/neuralforecast/](https://pypi.org/project/neuralforecast/)
  doc_url: https://nixtlaverse.nixtla.io/neuralforecast
  dev_url: https://github.com/Nixtla/neuralforecast

extra:
  recipe-maintainers:
    - sugatoray
    - cchallu
    - FedericoGarza
  skip-lints:
    - cbc_dep_in_run_missing_from_host